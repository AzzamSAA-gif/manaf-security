<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SafeHours · مناف</title>
<meta name="theme-color" content="#081106">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;--f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#081106;overflow:hidden}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

#tv{position:fixed;inset:0;z-index:100;color:#f2f8ec;font-family:var(--f-body);display:grid;grid-template-rows:auto 1fr auto auto;gap:2.2vh;
  padding:calc(3vh + env(safe-area-inset-top,0px)) max(3.5vw, env(safe-area-inset-right,0px)) calc(2.5vh + env(safe-area-inset-bottom,0px)) max(3.5vw, env(safe-area-inset-left,0px));
  background:radial-gradient(90% 120% at 0% 100%,#24501a 0%,transparent 55%),radial-gradient(60% 80% at 100% 0%,#173a10 0%,transparent 60%),linear-gradient(135deg,#081106,#10230a);color-scheme:dark;cursor:none}
#tv.cursor{cursor:default}
#tv::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 5vw,rgba(255,255,255,.035) 5vw calc(5vw + 1px));pointer-events:none}
#tv>*{position:relative;z-index:1}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:2vw}
.tv-brand{display:flex;align-items:center;gap:1.6vw}
.tv-brand img{height:clamp(36px,7vh,90px);width:auto}
.tv-brand div{display:flex;flex-direction:column;border-inline-start:1px solid rgba(255,255,255,.2);padding-inline-start:1.6vw}
.tv-brand b{font-family:var(--f-display);font-size:clamp(16px,2.6vh,34px);font-weight:600}
.tv-brand span{font-size:clamp(12px,1.9vh,24px);color:#a9c39a}
.tv-clock{display:flex;flex-direction:column;align-items:flex-end;text-align:left}
.tv-clock b{font-family:var(--f-display);font-size:clamp(28px,6vh,76px);font-weight:600;line-height:1;direction:ltr}
.tv-clock span{font-size:clamp(12px,1.9vh,24px);color:#a9c39a}
.tv-main{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4vw;min-height:0}
.tv-hero{display:flex;flex-direction:column;gap:1.2vh;min-width:0}
.tv-label{font-size:clamp(18px,3.4vh,44px);color:#cfe3c2;font-weight:500}
.tv-num{font-family:var(--f-display);font-weight:700;font-size:min(13vw,24vh);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;color:#fff;text-shadow:0 0 6vh rgba(125,187,69,.25)}
.tv-unit{font-family:var(--f-display);font-size:clamp(18px,3.6vh,46px);color:#8ccb52;font-weight:600}
.tv-ach{display:inline-flex;align-self:flex-start;align-items:center;gap:.6em;background:#7dbb45;color:#0b1606;border-radius:999px;padding:.5vh 1.6vw;font-family:var(--f-display);font-weight:600;font-size:clamp(14px,2.4vh,30px);margin-top:1vh}
.tv-gauge{display:flex;flex-direction:column;align-items:center;gap:1vh}
.tv-gauge svg{width:min(26vw,44vh);height:auto}
.tv-gauge b{font-family:var(--f-display);font-size:clamp(24px,5vh,64px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tv-gauge span{font-size:clamp(12px,2vh,26px);color:#a9c39a;text-align:center}
.tv-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4vw}
.tv-stats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:2vh;padding:2vh 1.6vw;display:flex;flex-direction:column;gap:.4vh;min-width:0}
.tv-stats b{font-family:var(--f-display);font-size:clamp(20px,5vh,64px);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-stats span{font-size:clamp(11px,2vh,26px);color:#a9c39a}
.tv-foot{display:flex;justify-content:space-between;align-items:center;gap:2vw;border-top:1px solid rgba(255,255,255,.12);padding-top:1.8vh}
.tv-msg{display:flex;align-items:center;gap:.7em;font-family:var(--f-display);font-size:clamp(16px,3.2vh,40px);font-weight:500;color:#e6f2dc;min-width:0}
.tv-msg svg{color:#8ccb52;flex:none}
#tv-msg{transition:opacity .6s}
#tv-msg.fade{opacity:0}
#tv-upd{font-size:clamp(10px,1.6vh,20px);color:#86a996;white-space:nowrap}
.tv-unused{position:absolute!important;top:calc(1.5vh + env(safe-area-inset-top,0px));left:calc(50% - 90px);width:180px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;opacity:0;transition:opacity .3s;font-size:14px}
#tv.cursor .tv-unused{opacity:1}
@media (max-aspect-ratio:1/1){.tv-main{grid-template-columns:minmax(0,1fr)}.tv-gauge svg{width:40vw}.tv-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tv-num{font-size:18vw}}

.tv-state{position:absolute!important;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:5vw;background:#081106;z-index:5;font-size:clamp(16px,2.6vh,32px);color:#cfe3c2}
.tv-state b{font-family:var(--f-display);font-size:clamp(20px,3.6vh,44px);color:#fff}
.tv-stale{color:#f4d98b!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fdate=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `${Number(d)} ${MONTHS[Number(m)-1]} ${y}`;};
let D=null,shown=0,anim=null,msgI=0;

function load(){
  // JSONP read of the public sheet (works from any static host, no CORS needed)
  const cb='shcb'+Date.now();const el=document.createElement('script');let done=false;
  window[cb]=r=>{done=true;try{
      const rows=(r&&r.table&&r.table.rows)||[];let raw='';
      for(const row of rows){const c=row.c||[];if(c[0]&&c[0].v==='safehours'){raw=c[1]&&(c[1].v||c[1].f)||'';break;}}
      if(!raw)throw 0;const d=JSON.parse(raw);D=d;
      try{localStorage.setItem('sh-cache',raw);}catch(e){}
      ok(true);
    }catch(e){fail('الملف لا يحتوي بيانات صالحة.');}
    finally{delete window[cb];el.remove();}};
  el.src=`https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=Display&headers=0&range=A1:B1&_=${Date.now()}`;
  el.onerror=()=>{if(!done){delete window[cb];el.remove();fail('تعذّر الوصول إلى ملف البيانات. تأكد أن الملف مشارك «أي شخص لديه الرابط».');}};
  document.head.appendChild(el);
  setTimeout(()=>{if(!done)fail('تعذّر الوصول إلى ملف البيانات. تأكد أن الملف مشارك «أي شخص لديه الرابط».');},20000);
}
let failed=false;
function fail(msg){
  if(!D){try{const c=localStorage.getItem('sh-cache');if(c)D=JSON.parse(c);}catch(e){}}
  if(D){failed=true;ok(false);return;}
  $('#tv-wait').hidden=false;$('#tv-wait-msg').textContent=msg;
}
function ok(fresh){failed=!fresh;$('#tv-wait').hidden=true;render();}

function schedFor(dateStr){const s=String(D.sched||'').split(',').map(Number);return s[parse(dateStr).getDay()]||0;}
function current(){
  const today=iso(new Date());let safe=Number(D.safeBase)||0,est=0;
  if(Number(D.autoFill)!==0&&D.lastRec){
    const startFrom=[D.lastRec,D.lastReset||'',D.startDate?addDays(D.startDate,-1):''].sort().pop();
    let d=addDays(startFrom,1),g=0;
    while(d<=today&&g++<400){const h=schedFor(d);
      if(d<today)est+=h;else{const n=new Date(),m=n.getHours()*60+n.getMinutes();est+=h*Math.max(0,Math.min(1,(m-420)/540));}
      d=addDays(d,1);}
  }
  safe+=est;
  const days=D.refDate?Math.max(0,diffDays(today,D.refDate)):0;
  // safe hours two weeks ago, to show a milestone banner for 14 days
  let back=0,d=addDays(today,-13);while(d<=today){back+=schedFor(d);d=addDays(d,1);}
  const runStart=D.lastReset?addDays(D.lastReset,1):(D.startDate||D.refDate||'');
  const safe14=runStart&&diffDays(today,runStart)<14?0:Math.max(0,safe-back);
  return {safe,est,days,safe14};
}
function gaugeSVG(pct){
  const H=[92,122,140,122,92],bw=24,gap=13,x0=(200-(5*bw+4*gap))/2,p=pct/100;let g='<defs>';
  H.forEach((h,i)=>{const x=x0+i*(bw+gap),y=75-h/2;g+=`<clipPath id="tg${i}"><rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="${bw/2}"/></clipPath>`;});
  g+='</defs>';
  H.forEach((h,i)=>{const x=x0+i*(bw+gap),y=75-h/2,f=Math.max(0,Math.min(1,p*5-(4-i))),fh=h*f;
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="${bw/2}" fill="rgba(255,255,255,.13)"/>`;
    if(fh>0)g+=`<rect x="${x}" y="${y+h-fh}" width="${bw}" height="${fh}" fill="#8ccb52" clip-path="url(#tg${i})"/>`;});
  return g;
}
function render(){
  if(!D)return;const k=current(),noun=D.noun||'إصابات',y=String(new Date().getFullYear());
  $('#tv-company').textContent=D.company||'SafeHours';
  $('#tv-site').textContent=D.site||'مؤشر ساعات العمل الآمنة';
  $('#tv-label').textContent='ساعات عمل آمنة بدون '+noun;
  $('#tv-days-l').textContent='يوم بدون '+noun;
  $('#tv-days').textContent=fmt(k.days);
  $('#tv-last').textContent=D.lastReset?(D.lastReset.slice(0,4)===y?fdate(D.lastReset).replace(/ \d{4}$/,''):fdate(D.lastReset)):'لا يوجد';
  $('#tv-record').textContent=Number(D.record)?fmt(D.record):'—';
  $('#tv-nm').textContent=String(D.year)===y?fmt(D.nmYear):'0';
  const next=MILESTONES.find(m=>m>k.safe)||Math.ceil((k.safe+1)/10e6)*10e6,prev=[...MILESTONES].reverse().find(m=>m<=k.safe)||0;
  const pct=Math.min(100,Math.max(0,(k.safe-prev)/(next-prev)*100));
  $('#tv-gauge').innerHTML=gaugeSVG(pct);$('#tv-pct').textContent=Math.floor(pct)+'%';
  $('#tv-goal').textContent=`نحو هدف ${fmt(next)} ساعة · متبقٍ ${fmt(next-k.safe)}`;
  const hit=MILESTONES.filter(m=>m<=k.safe&&m>k.safe14).pop(),ach=$('#tv-ach');
  ach.hidden=!hit;if(hit)ach.textContent=`إنجاز: تجاوزنا ${fmt(hit)} ساعة عمل آمنة`;
  const upd=$('#tv-upd');upd.classList.toggle('tv-stale',failed);
  upd.textContent=(failed?'تعذّر التحديث، تُعرض آخر بيانات محفوظة · ':'')+(D.lastRec?`آخر تسجيل للساعات: ${fdate(D.lastRec)}${k.est?' · يشمل تقديراً للأيام اللاحقة':''}`:'');
  const target=Math.round(k.safe),el=$('#tv-num');cancelAnimationFrame(anim);
  if(!shown&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const t0=performance.now(),dur=1800;
    const step=t=>{const f=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-f,3);el.textContent=fmt(target*e);if(f<1)anim=requestAnimationFrame(step);};anim=requestAnimationFrame(step);}
  else el.textContent=fmt(target);
  shown=target;
}
function msgs(){const m=String((D&&D.msgs)||'').split('||').map(s=>s.trim()).filter(Boolean);return m.length?m:['السلامة مسؤولية الجميع'];}
function nextMsg(){const m=msgs(),el=$('#tv-msg');el.classList.add('fade');setTimeout(()=>{msgI=(msgI+1)%m.length;el.textContent=m[msgI];el.classList.remove('fade');},600);}
function clock(){const n=new Date();$('#tv-time').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`;
  try{$('#tv-date').textContent=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(n);
    $('#tv-hijri').textContent=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(n);}catch(e){}}
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen');}catch(e){}}

clock();setInterval(()=>{clock();render();},30000);
setInterval(nextMsg,10000);
load();setInterval(load,5*60000);
setTimeout(()=>location.reload(),6*3600e3); // pick up page updates a few times a day
wake();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();load();}});
document.addEventListener('click',()=>{try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}catch(e){}});
})();
</script>
</body>
</html>
